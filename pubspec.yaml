name: medical_lab_flutter
description: مختبر القمة للتحليلات المرضية - تطبيق متكامل للفحوصات الطبية
publish_to: 'none'
version: 1.0.0+10

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # إدارة الحالة
  provider: ^6.1.1

  # الشبكة والـ API
  http: ^1.1.2

  # المصادقة والتخزين
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^10.0.0

  # التصميم والـ UI
  flutter_screenutil: ^5.9.0
  gap: ^3.0.0
  intl: ^0.20.0

  # الإشعارات و Firebase
  # (نبقي core + messaging للإشعارات المستقبلية — صلاحية AD_ID
  #  تُزال من AndroidManifest.xml فلا تؤثر على Google Play)
  firebase_core: ^4.4.0
  firebase_messaging: ^16.1.1
  flutter_local_notifications: ^17.0.0
  workmanager: ^0.6.0

  # الموقع الجغرافي (زر "تحديد موقعي" في التسجيل)
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # فتح الروابط الخارجية (موقع تيم القادة، خرائط جوجل...)
  url_launcher: ^6.2.4

  # أدوات البناء (شعار التطبيق وشاشة البداية)
  flutter_launcher_icons: "^0.13.1"
  flutter_native_splash: ^2.3.9

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# إجبار جميع المكتبات على استخدام النسخة الحديثة من intl
dependency_overrides:
  intl: ^0.20.0

flutter:
  uses-material-design: true

  # الأصول (Assets)
  assets:
    - assets/

  # الخطوط (Fonts)
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  image_path: "assets/icon.png" # مسار صورتك مال المختبر
  min_sdk_android: 21